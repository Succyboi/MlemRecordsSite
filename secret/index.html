  margin-bottom: 1em;
  gap: 1em;

.release {
  margin: auto;
  justify-self: stretch;
  max-width: 100%;
}

.release.big {
  max-width: 100%;
}

  margin-top: 2em;
  margin-bottom: 2em;
  margin-left: 4em;
  margin-right: 4em;
}

  text-transform: lowercase;

  text-overflow: ellipsis;
  max-width: inherit;
  display: block;
}

.release-title {
  margin: 0;

.release-title-small {
  margin: 0;

.release-title-smaller {
  margin: 0;
  font-size: 1em;

.release-single img {
  display: block;
  margin: auto;
}

.release.playing img.release-cd-cover {
  border-radius: 50%;
  transform: rotate(calc(360deg * 100));

  transition: transform calc(60s * 100);
  transition-timing-function: ease;
}

.release-cd {
  width: 100%;
  height: 100%;
  margin-top: 0em;
  margin-bottom: 0.5em;
}

.release-cd-back {
  position: fixed;
  top: inherit;
  left: 0;
  width: 102%;
  max-width: 1000%;
  aspect-ratio: 1 / 0.92;
  object-fit: fill;
  
  pointer-events: none;
  z-index: -1;
}

.release-cd-front {
  position: fixed;
  left: 0;
  width: 102%;
  max-width: 1000%;
  aspect-ratio: 1 / 0.92;
  object-fit: fill;
  opacity: 25%;

  pointer-events: none;
  z-index: 1;
}

.release-cd-cover {
  display: block;
  padding-top: 2%;
  padding-left: 10%;
  width: 90%;
  z-index: 0;
}

.shadow {
  filter: drop-shadow(0px 0px calc(var(--dropShadowSize) * 0.5) var(--textColor));
}

.halfshadow {
  filter: drop-shadow(0px 0px calc(var(--dropShadowSize) * 0.25) var(--textColor));
}

.release-cd-back.shadow {
  filter: drop-shadow(0px 0px calc(var(--dropShadowSize) * 0.5) var(--textColor));
}

.events-container {

.events-archive-container {

.catalogue-container {

.catalogue-item {
  display: flex;

}

.catalogue-item-no {

.catalogue-item-name {

}

.catalogue-item-artist {
  text-overflow: ellipsis;
  white-space: nowrap;
}

.audio {
  position: sticky;
  top: 0;
  text-align: center;
  padding-top: 0;
  padding-bottom: 1em;
  background-color: var(--backgroundColor);
  z-index: 1;
}

.audio-controls {
  height: 1em;

  align-items: center;
  justify-content: left;
  gap: 1ch;
}

.audio-button {

  min-width: 2ch;

  color: var(--linkColor);
  background: none;

  border: none;
  cursor: pointer;
}

.audio-title {
  display: block;
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
  flex-grow: 1;
  font-style: italic;
}

.audio-time {
  min-width: 4.5ch;
  text-align: left;
  white-space: nowrap;
}

.audio-position {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 0px;
  background: none;
  padding: 1em;
  padding-top: 2.5em;
  margin: -1em;
  margin-bottom: 0em;
}

.audio-position::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  opacity: 0;
}

.audio-position::-moz-range-thumb {
  -webkit-appearance: none;
  appearance: none;
  opacity: 0;
}

 
.audio-position::-webkit-slider-runnable-track {
  height: 1px;
  -webkit-appearance: none;
  background-color: var(--linkColor);
  margin-top: -1px;
}

 
.audio-position::-moz-range-progress {
  background-color: var(--linkColor);
}
.audio-position::-moz-range-track {  
  background-color: var(--textColor);
}
 
.audio-position::-ms-fill-lower {
  background-color: var(--linkColor);
}
.audio-position::-ms-fill-upper {  
  background-color: var(--textColor);
}

.audio-preview {
  position: relative;
  padding: 0;
  width: 9ch;
  margin-right: 1ch;
}

.audio-preview-controls {
  display: inline-block;
  background-color: var(--textColor);
  min-width: 7.5ch;
}

.audio-preview-button {
  user-select: none;
  padding: 0 0.5ch;
  font-size: 1em;
  color: var(--backgroundColor);
  background: none;

  border: none;
  cursor: pointer;
}

.shop-button-container {
  margin-top: 2em;
  margin-bottom: 2em;
}

.button {
  display: inline-block;

}

.button-text {
  padding: 0 0.5ch;
  color: var(--backgroundColor);
  background: none;

  border: none;
  text-decoration: none;

}

.audio-preview-title {

  white-space: nowrap;
  color: var(--backgroundColor);
}

.radio-container {

}

.video-section {

}

.video-embed {

  left: 0;
  bottom: 0;
  right: 0;

  height: 100%;

}

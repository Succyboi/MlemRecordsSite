  display: block;
  margin: auto;

.release.playing .release-cd-cover > img {
  border-radius: 50%;

  transition: transform calc(60s * 100);
  transition-timing-function: ease;
}

.release-cd {
  width: 100%;
  height: 100%;
  margin-top: 0em;
  margin-bottom: 0.5em;
}

.release-cd-back {
  position: fixed;
  top: inherit;
  left: 0;

  pointer-events: none;
  z-index: -1;
}

.release-cd-front {
  position: fixed;
  left: 0;
  width: 102%;
  max-width: 1000%;
  aspect-ratio: 1 / 0.92;
  object-fit: fill;
  opacity: 25%;

  pointer-events: none;
  z-index: 1;
}

.release-cd-cover {
  display: block;
  padding-top: 2%;
  padding-left: 10%;
  width: 90%;
  z-index: 0;

.shadow {

.halfshadow {

}

.catalogue-item-artist {

}

.audio {

  padding-top: 0;

}

}

.audio-title {
  display: block;
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
  flex-grow: 1;
  font-style: italic;
}

.audio-time {
  min-width: 4.5ch;
  text-align: left;
  white-space: nowrap;
}

.audio-position {

  width: 100%;
  height: 0px;

  padding: 1em;
  padding-top: 2.5em;
  margin: -1em;
  margin-bottom: 0em;
}

.audio-position::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  opacity: 0;
}

.audio-position::-moz-range-thumb {
  -webkit-appearance: none;
  appearance: none;
  opacity: 0;
}

}

 
.audio-position::-moz-range-progress {
  background-color: var(--linkColor);
}
.audio-position::-moz-range-track {  
  background-color: var(--textColor);
}
 
.audio-position::-ms-fill-lower {
  background-color: var(--linkColor);
}
.audio-position::-ms-fill-upper {  
  background-color: var(--textColor);
}

.audio-preview {

}

.audio-preview-controls {
  display: inline-block;
  background-color: var(--textColor);
  min-width: 7.5ch;
}

.audio-preview-button {
  user-select: none;
  padding: 0 0.5ch;
  font-size: 1em;

  background: none;

  border: none;
  cursor: pointer;
}

.shop-button-container {

.button {

}

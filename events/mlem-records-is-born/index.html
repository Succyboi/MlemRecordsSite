  display: block;

.release.playing img.release-cd-cover {

  transition: transform calc(60s * 100);
  transition-timing-function: ease;
}

.release-cd {

  height: 100%;

  margin-bottom: 0.5em;
}

  position: fixed;

  z-index: -1;
}

  position: fixed;
  left: 0;
  width: 102%;
  max-width: 1000%;
  aspect-ratio: 1 / 0.92;
  object-fit: fill;
  opacity: 25%;

  pointer-events: none;
  z-index: 1;
}

.release-cd-cover {
  display: block;
  padding-top: 2%;

.catalogue-item-artist {

}

}

.audio-title {

  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
  flex-grow: 1;
  font-style: italic;
}

}

  margin: -1em;

}

.audio-position::-webkit-slider-thumb {
  -webkit-appearance: none;

}

.audio-position::-moz-range-thumb {
  -webkit-appearance: none;
  appearance: none;
  opacity: 0;
}

}

 
.audio-position::-moz-range-progress {
  background-color: var(--linkColor);
}
.audio-position::-moz-range-track {  
  background-color: var(--textColor);
}
 
.audio-position::-ms-fill-lower {
  background-color: var(--linkColor);
}
.audio-position::-ms-fill-upper {  
  background-color: var(--textColor);
}

.audio-preview {

}

.audio-preview-controls {

}

  border: none;

.shop-button-container {

.button {

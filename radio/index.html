  from { transform: rotate(0deg); }

  font-family: Inter, sans-serif;

  color: var(--textColor);
}

h1,
h2,
h3,
h4,
h5,
h6,
strong,
b {

}

h1 > em,
h2 > em,
h3 > em,
h4 > em,
h5 > em,
h6 > em {
  font-weight: normal;
}

h2 > a,
h3 > a,
h4 > a,
h5 > a,
h6 > a {

  text-decoration: none;
}

a {
  color: var(--linkColor);
}

.title {
  text-decoration: none;
}

.title span {
  font-weight: 400;
}

nav a {
  margin-right: 1ch;
}

textarea {
  width: 100%;
  font-size: 16px;
}

input {
  font-size: 16px;
}

content {
  line-height: 1.6;
}

table {
  width: 100%;
}

img {
  max-width: 100%;
}

p {
  margin: 1em 0;
}

p > em img {
  display: block;
  max-width: 75%;
  margin-left: auto;
  margin-right: auto;
}

code {
  padding: 2px;
  background-color: var(--semiBackgroundColor);
}

pre code {
  color: var(--semiTextColor);
  padding: 20px;
  white-space: pre-wrap;
  font-size: 14px;
  overflow-x: auto;
}

hr {
  color: var(--textColor);
  background-color: var(--textColor);
  border-top: 1px solid var(--textColor);
}

footer {
  text-align: center;
}

div.highlight pre {
  background-color: initial;
  color: initial;
}

div.highlight code {
  background-color: unset;
  color: unset;
}

blockquote {
  border-left: 2px solid var(--semiLinkColor);
  color: var(--semiTextColor);
  padding-left: 1em;
  margin-left: 1em;
  font-style: italic;
}

footer {
  padding: 25px;
  justify-content: center;
}

iframe {
  border: 0px;
}

.center {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 1ch;
}

.helptext {
  color: var(--semiTextColor);
  font-size: small;
}

.errorlist {
  color: var(--linkColor);
  font-size: small;
}

 
ul.blog-posts {
  list-style-type: none;
  padding: unset;
}

ul.blog-posts li {
  display: flex;
}

ul.blog-posts li .time {
  min-width: 11ch;
}

ul.blog-posts li a {
  margin-right: 1ch;
}

.inline {
  height: 1em;
  vertical-align: baseline;
}

.release-container {
  display: grid;
  grid-template-columns: 
    repeat(auto-fill, 
     minmax(clamp(100%/3 + 0.1%,(50% - 100%)*1000,100%/2 + 0.1%),1fr));
  justify-items: right;
  margin-top: 0em;
  margin-bottom: 1em;
  gap: 1em;
}

.release {
  margin: auto;
  justify-self: stretch;
  max-width: 100%;
}

.release.big {
  max-width: 100%;
}

.release-single {
  margin-top: 2em;
  margin-bottom: 2em;
  margin-left: 4em;
  margin-right: 4em;
}

.release-header {
  text-transform: lowercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: inherit;
  display: block;
}

.release-title {
  margin: 0;
}

.release-title-small {
  margin: 0;
  font-size: 1.25em;
}

.release-title-smaller {
  margin: 0;
  font-size: 1em;
}

.release-single img {
  display: block;
  margin: auto;
}

.release.playing img.release-cd-cover {
  border-radius: 50%;
  transform: rotate(calc(360deg * 100));

  transition: transform calc(60s * 100);
  transition-timing-function: ease;
}

.release-cd {
  width: 100%;
  height: 100%;
  margin-top: 0em;
  margin-bottom: 0.5em;
}

.release-cd-back {
  position: fixed;
  top: inherit;
  left: 0;
  width: 102%;
  max-width: 1000%;
  aspect-ratio: 1 / 0.92;
  object-fit: fill;
  
  pointer-events: none;
  z-index: -1;
}

.release-cd-front {
  position: fixed;
  left: 0;
  width: 102%;
  max-width: 1000%;
  aspect-ratio: 1 / 0.92;
  object-fit: fill;
  opacity: 25%;

  pointer-events: none;
  z-index: 1;
}

.release-cd-cover {
  display: block;
  padding-top: 2%;
  padding-left: 10%;
  width: 90%;
  z-index: 0;
}

.shadow {
  filter: drop-shadow(0px 0px calc(var(--dropShadowSize) * 0.5) var(--textColor));
}

.halfshadow {
  filter: drop-shadow(0px 0px calc(var(--dropShadowSize) * 0.25) var(--textColor));
}

.release-cd-back.shadow {
  filter: drop-shadow(0px 0px calc(var(--dropShadowSize) * 0.5) var(--textColor));
}

.events-container {
  display: grid;
  grid-template-columns: repeat(2, calc(50% - 10px));
  margin-top: 0em;
  margin-bottom: 1em;
  gap: 1em;
}

.events-archive-container {
  display: grid;
  grid-template-columns: repeat(2, calc(50% - 10px));
  margin-top: 0em;
  margin-bottom: 1em;
  gap: 1em;
}

.catalogue-container {
  font-size: smaller;
  list-style-type: none;
}

.catalogue-item {
  display: flex;
  gap: 1ch;
}

.catalogue-item-no {
  min-width: 7ch;
}

.catalogue-item-name {
  display: block;
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
  flex-grow: 1;
}

.catalogue-item-artist {
  text-overflow: ellipsis;
  white-space: nowrap;
}

.audio {
  position: sticky;
  top: 0;
  text-align: center;
  padding-top: 0;
  padding-bottom: 1em;
  background-color: var(--backgroundColor);
  z-index: 1;
}

.audio-controls {
  height: 1em;
  display: flex;
  align-items: center;
  justify-content: left;
  gap: 1ch;
}

.audio-button {
  width: 2ch;
  min-width: 2ch;
  max-width: 2ch;
  padding: 0;
  font-size: 1.5em;
  color: var(--linkColor);
  background: none;

  border: none;
  cursor: pointer;
}

.audio-title {
  display: block;
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
  flex-grow: 1;
  font-style: italic;
}

.audio-time {
  min-width: 4.5ch;
  text-align: left;
  white-space: nowrap;
}

.audio-position {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 0px;
  background: none;
  padding: 1em;
  padding-top: 2.5em;
  margin: -1em;
  margin-bottom: 0em;
}

.audio-position::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  opacity: 0;
}

.audio-position::-moz-range-thumb {
  -webkit-appearance: none;
  appearance: none;
  opacity: 0;
}

 
.audio-position::-webkit-slider-runnable-track {
  height: 1px;
  -webkit-appearance: none;
  background-color: var(--linkColor);
  margin-top: -1px;
}

 
.audio-position::-moz-range-progress {
  background-color: var(--linkColor);
}
.audio-position::-moz-range-track {  
  background-color: var(--textColor);
}
 
.audio-position::-ms-fill-lower {
  background-color: var(--linkColor);
}
.audio-position::-ms-fill-upper {  
  background-color: var(--textColor);
}

.audio-preview {
  position: relative;
  padding: 0;
  width: 9ch;
  margin-right: 1ch;
}

.audio-preview-controls {
  display: inline-block;
  background-color: var(--textColor);
  min-width: 7.5ch;
}

.audio-preview-button {
  user-select: none;
  padding: 0 0.5ch;
  font-size: 1em;
  color: var(--backgroundColor);
  background: none;

  border: none;
  cursor: pointer;
}

.shop-button-container {
  margin-top: 2em;
  margin-bottom: 2em;
}

.button {
  display: inline-block;
  background-color: var(--textColor);
}

.button-text {
  padding: 0 0.5ch;
  color: var(--backgroundColor);
  background: none;

  border: none;
  text-decoration: none;
  cursor: pointer;
}

.audio-preview-title {
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--backgroundColor);
}

.radio-container {
  display: grid;
  grid-template-columns: calc(40% - 10px) calc(60% - 10px);
  margin-top: 2em;
  margin-bottom: 2em;
  gap: 1em;
  align-items: end;
}

.video-container {
  position: relative;
  overflow: hidden;
  width: 100%;
  padding-top: 56.25%;
}

.video-section {
  margin-top: 1em;
}

.video-embed {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  right: 0;
  width: 100%;
  height: 100%;
}

.ransom_text {
  pointer-events: none;
  margin-top: 0em;
  margin-bottom: 0em;
  margin-right: 0em;
}

.ransom_letter {
  display: inline-block;

  margin-top: 0.5em;
  margin-left: -0.3em;
  margin-right: -0.3em;

  height: 1.5em;
}

@media only screen and (max-width: 768px) {
  .release-container {
    display: grid;
    grid-template-columns: repeat(1, 100%);

    margin-left: 0;

    display: none;
  }

    z-index: 1;
  }

  .release-cd-cover {
    display: block;
    padding-top: 2%;
    padding-left: 10%;
    width: 90%;
    z-index: 0;
  }

  .events-container {
    display: grid;
    grid-template-columns: repeat(1, 100%);
    margin-top: 0em;
    margin-bottom: 1em;
    gap: 1em;
  }

  .events-archive-container {
    display: grid;
    grid-template-columns: repeat(1, 100%);
    margin-top: 0em;
    margin-bottom: 1em;
    gap: 3em;
  }

  .radio-container {
    display: grid;
    grid-template-columns: repeat(1, 100%);
    margin-top: 2em;
    margin-bottom: 3em;
    gap: 1em;
    align-items: end;
  }
}

<div id="release-audio-container" style="display: none;">
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const audioBaseUrl = "https:\/\/radio.mlemrecords.com";
            const audioStation = "mlem.fm";
            const audioStreamUrl = `${audioBaseUrl}/listen/${audioStation}/radio.mp3`;
            const audioApiUrl = `${audioBaseUrl}/api/nowplaying_static/${audioStation}.json`;
            
            const videoBaseUrl = "https:\/\/owncast.mlemrecords.com";
            const videoApiUrl = `${videoBaseUrl}/api/status`;
            
            const apiFetchInterval = 1000;
            
            var radioData = null;
            var videoSection = document.getElementById("video-section");
            var radioSection = document.getElementById("radio-section");
            var audioContainer = document.getElementById('release-audio-container');
            var placeholder = document.getElementById('radio-placeholder');
            var audio = document.getElementById('radio-audio');
            var image = document.getElementById('radio-image');
            var audioSource = document.getElementById('radio-audio-source');
            var playButton = document.getElementById('radio-play');
            var currentTime = document.getElementById('radio-time');
            var audioPosition = document.getElementById('audio-position');
            var audioVolume = document.getElementById('audio-volume');
            var audioVolumeText = document.getElementById('audio-volume-text');
            var title = document.getElementById('radio-title');
            var description = document.getElementById('radio-description');

            var videoData = null;

            audio.volume = 0.8;
            audioVolume.value = audio.volume * 100;
            audioVolume.max = 100;

            playButton.addEventListener('click', function() {
                if (audio.paused) {
                    loadAudio();
                    audio.play();
                } else {
                    audio.pause();
                }

                updateButtons();
            });

            audioVolume.addEventListener('input', () => {
                audio.volume = audioVolume.value / 100;
                updateButtons();
            });

            audio.addEventListener('timeupdate', function() {
                updateTime();
            });

            async function fetchRadio() {
                radioData = null;

                await fetch(audioApiUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`Couldn't get ${audioApiUrl}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        radioData = data;
                        updateRadioApiData();
                    })
                    .catch(error => {
                        console.error('Error:', error);
                    });
            }

            async function fetchVideo() {
                videoData = null;

                await fetch(videoApiUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`Couldn't get ${videoApiUrl}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        videoData = data;
                        updateVideoApiData();
                    })
                    .catch(error => {
                        console.error('Error:', error);

                        audioContainer.style.display = "block";
                        placeholder.style.display = "none";
                    });
            }

            function updateVideoApiData() {
                let online = videoData.online;

                radioSection.style.display = online ? "none" : "block";
                videoSection.style.display = online ? "block" : "none";
                audioContainer.style.display = "block";
                placeholder.style.display = "none";

                if (online && !audio.paused) {
                    audio.pause();
                    updateButtons();
                }
            }

            function updateTime() {
                if (radioData == undefined) { return; }

                let nowPlaying = radioData.now_playing;
                let live = radioData.live;

                let songStart = new Date((live.is_live ? live.broadcast_start : nowPlaying.played_at) * 1000);
                let timeSince = Math.max(new Date().getTime() - songStart.getTime(), 0) / 1000;
                
                currentTime.innerHTML = formatTime(timeSince);
                audioPosition.value = timeSince;
                audioPosition.max = Math.floor(nowPlaying.duration);
            }

            function formatTime(seconds) {
                var minutes = Math.floor(seconds / 60);
                var seconds = Math.floor(seconds % 60);
                return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }

            function updateRadioApiData() {
                if (radioData == undefined) { return; }
                
                let station = radioData.station; 
                let live = radioData.live;
                let nowPlaying = radioData.now_playing;

                description.innerHTML = `<b>${live.is_live ? "LIVE" : station.name}</b> - ${live.is_live ? (live.streamer_name) : nowPlaying.playlist}`;
                let songTitle = nowPlaying.song.title;
                let songArtist = nowPlaying.song.artist
                title.innerText = `${nowPlaying.song.title}`;
                if (songArtist != "") {
                    title.innerText += ` by ${nowPlaying.song.artist}`;
                }

                image.source = new Image();
                image.source.onload = () => {
                    image.src = image.source.src;
                };
                image.source.src = nowPlaying.song.art;

                updateTime();
            }

            function updateButtons() {
                if (audio.paused) {
                    playButton.textContent = '►';
                } else {
                    playButton.textContent = '■';
                }

                audioVolumeText.innerText = `${audioVolume.value}%`;
            }

            function loadAudio() {
                audioSource.src = null;
                audioSource.srcObj = null;
                
                audioSource.src = audioStreamUrl;
                audio.load();
            }

            async function update() {
                const delay = ms => new Promise(res => setTimeout(res, ms));    
                while (true) {
                    await fetchRadio();
                    await fetchVideo();

                    await delay(apiFetchInterval);
                }
            };

            update();
            loadAudio();
            updateTime();
            updateRadioApiData();
            updateButtons();
        });
    </script>

.release-single img {
  display: block;
  margin: auto;
}

.release.playing img.release-cd-cover {
  border-radius: 50%;

  transition: transform calc(60s * 100);
  transition-timing-function: ease;
}

.release-cd {
  width: 100%;
  height: 100%;
  margin-top: 0em;
  margin-bottom: 0.5em;
}

.release-cd-back {
  position: fixed;
  top: inherit;
  left: 0;

  max-width: 1000%;
  aspect-ratio: 1 / 0.92;
  object-fit: fill;
  
  pointer-events: none;
  z-index: -1;
}

.release-cd-front {
  position: fixed;
  left: 0;
  width: 102%;
  max-width: 1000%;
  aspect-ratio: 1 / 0.92;
  object-fit: fill;
  opacity: 25%;

  pointer-events: none;
  z-index: 1;
}

.release-cd-cover {
  display: block;
  padding-top: 2%;
  padding-left: 10%;
  width: 90%;
  z-index: 0;
}

.halfshadow {

}

  filter: drop-shadow(0px 0px calc(var(--dropShadowSize) * 0.5) var(--textColor));
}

.catalogue-item-artist {

}

.audio-title {

}

}

}

.audio-position::-webkit-slider-thumb {

}

.audio-position::-moz-range-thumb {

  appearance: none;

}

}

 
.audio-position::-moz-range-progress {
  background-color: var(--linkColor);
}
.audio-position::-moz-range-track {  
  background-color: var(--textColor);
}

  background-color: var(--linkColor);
}
.audio-position::-ms-fill-upper {  
  background-color: var(--textColor);
}

.audio-preview {

}

.audio-preview-controls {
  display: inline-block;

}

.audio-preview-button {

  border: none;

.shop-button-container {

.button {

<content>
  <h1>DJ ZITwerK</h1>

  <p>DJ ZITwerK is a jungle and experimental hip hop project. 1000 massive dubplates, yet we still ponder &ldquo;who run tings&rdquo;.</p>

  
  <p>DJ ZITwerK has released 1 record with Mlem.</p>

  <div class="release-container">
    
    
    

    <div class="release">
        <small class="release-header">
            mlem001
        </small>
        <a href="https://mlemrecords.com/mlem001/">
            
                <img src="/mlem001/cover_hu_5fd7231c0aec06e3.webp" loading="lazy" alt="The cover for Amersfoort Tracks.">
            
        </a>
        <h2 class="release-title">
            <a href="https://mlemrecords.com/mlem001/">Amersfoort Tracks</a>
        </h2>by 
     <a href="https://mlemrecords.com/artists/dj-zitwerk/">DJ ZITwerK</a>
<br><span id="mlem001-audio-container" class="audio-preview" style="display: none;">
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function() {
            var audioBasePath = "\/downloads\/[mlem001] DJ ZITwerK - Amersfoort Tracks";
            var audioSrcs = [
                "1. Utrecht Centraal, Track 7 (0V3RStimmD Mix)", 
                "2. Whaaaat Stretch (Zwolle to Groningen Mix)", 
                "3. Amsterdam Amstel (Day Old Cinnamon Bun Mix)", 
                "4. Check the Shoezz (Zuid GVB Mix)", 
                "5. (O-O) (Isolatorweg Mix)", 
                "6. ZITwerK LIVE @ Nijmegen (~230 KPH Mix)", 
                
            ];

            var currentAudio = parseInt("2") - 1;
            var currentAudioPath = "";
            var audioContainer = document.getElementById('mlem001-audio-container');
            var audio = document.getElementById('page-audio');
            var audioSource = document.getElementById('page-audio-source');
            var playButton = document.getElementById('mlem001-play');
            var playing = false;

            playButton.addEventListener('click', function() {
                audio.pause();

                if (playing) {
                    playing = false;
                } else {
                    loadAudio();
                    audio.currentTime = 0;
                    audio.play();
                    playing = true;
                }

                updateButtons();
            });

            audio.addEventListener('ended', function() {
                audio.pause();
                playing = false;
                
                updateButtons();
            });

            audio.addEventListener('timeupdate', function() {                
                updateButtons();
            });

            audio.addEventListener('play', function() {
                if (audioSource.src.includes(currentAudioPath)) { return; }
                
                playing = false;
                
                updateButtons();
            });

            audio.addEventListener('pause', function() {
                playing = false;
                
                updateButtons();
            });

            function updateButtons() {
                if (playing) {
                    playButton.textContent = `■ ${formatTime(audio.currentTime)}`;
                } else {
                    playButton.textContent = '► Preview';
                }
            }

            function loadAudio() {
                audioSource.src = currentAudioPath = encodeURI(`${audioBasePath}/${audioSrcs[currentAudio]}.mp3`);
                audio.load();
                audio.volume = 0.75;
            }

            function formatTime(seconds) {
                var minutes = Math.floor(seconds / 60);
                var seconds = Math.floor(seconds % 60);
                return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }

            loadAudio();
            updateButtons();

            audioContainer.style.display = "inline-block";
        });
    </script>

    <span class="audio-preview-controls">
        <a id="mlem001-play" class="audio-preview-button"></a>
    </span>

  display: block;

  height: 100%;

  z-index: -1;

  position: fixed;
  left: 0;
  width: 102%;

  z-index: 1;
}

}

}

}

  appearance: none;

  background-color: var(--linkColor);
}
.audio-position::-moz-range-track {

}
.audio-position::-ms-fill-upper {

.audio-preview-controls {

}

.shop-button-container {

.button {

  <h1>Jørgen Valdemar</h1>

  <p>Jørgen Valdemar is a singer songwriter from the Netherlands. He&rsquo;s also a member of <a href="https://staging.mlemrecords.com/artists/kinderpunk/">KINDERPUNK</a>.</p>

  
  <p>Jørgen Valdemar has 1 Mlem release.</p>

  <div class="release-container">
    
    
    
    

    <div id="mlem003" class="release big">
        <small class="release-header">
            mlem003<i> Album</i>
        </small>
        
            <div class="release-cd">
                
                <img src="/images/cd_front0_hu_cd087eb5bce02621.png" class="release-cd-back shadow">
                <img src="/images/cd_back_hu_2c3f8ab1f30608c6.png" class="release-cd-back shadow"><a href="https://staging.mlemrecords.com/mlem003/">
                    
                    <img src="/mlem003/cover_hu_a0251b67c6f2bb33.png" loading="lazy" alt="The cover for Pieces of Peace." class="release-cd-cover">
                    
                </a>
                
            </div>
        
        <h2 class="release-title">
            <a href="https://staging.mlemrecords.com/mlem003/">Pieces of Peace</a>
        </h2>by 
     <a href="https://staging.mlemrecords.com/artists/j%C3%B8rgen-valdemar/">Jørgen Valdemar</a>
<br>
        <span id="mlem003-audio-container" class="audio-preview" style="display: none;">
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function() {
            var audioBasePath = "\/downloads\/[mlem003] Jørgen Valdemar - Pieces of Peace";
            var audioSrcs = [
                "1. Deep Red", 
                "2. A Small Cabin In The Woods", 
                "3. Worries Pt. 1", 
                "4. It Isn't True", 
                "5. I Thought About Pain", 
                "6. Pinned Away", 
                "7. Worries Pt. 2", 
                "8. Touch", 
                "9. Pieces Of Peace", 
                "10. Three Words", 
                "11. Worries Pt. 3", 
                "12. No Self", 
                "13. Nude", 
                "14. Is It Ever True", 
                "15. Worries Pt. 4", 
                "16. Poking Holes", 
                "17. Lieke", 
                
            ];

            var currentAudio = parseInt("2") - 1;
            var currentAudioPath = "";
            var audioContainer = document.getElementById('mlem003-audio-container');
            var audio = document.getElementById('page-audio');
            var audioSource = document.getElementById('page-audio-source');
            var playButton = document.getElementById('mlem003-play');
            var releaseParent = document.getElementById('mlem003');
            var playing = false;

            playButton.addEventListener('click', function() {
                audio.pause();

                if (playing) {
                    playing = false;
                } else {
                    loadAudio();
                    audio.currentTime = 0;
                    audio.play();
                    playing = true;
                }

                updateButtons();
            });

            audio.addEventListener('ended', function() {
                audio.pause();
                playing = false;
                
                updateButtons();
            });

            audio.addEventListener('timeupdate', function() {                
                updateButtons();
            });

            audio.addEventListener('play', function() {
                if (audioSource.src.includes(currentAudioPath)) { return; }
                
                playing = false;
                
                updateButtons();
            });

            audio.addEventListener('pause', function() {
                playing = false;
                
                updateButtons();
            });

            function updateButtons() {
                if (playing) {
                    playButton.textContent = `■ ${formatTime(audio.currentTime)}`;

                    if (releaseParent != null) {
                        releaseParent.classList.add("playing");
                    }
                } else {
                    playButton.textContent = '► Preview';
                    
                    if (releaseParent != null) {
                        releaseParent.classList.remove("playing");
                    }
                }

            }

            function loadAudio() {
                audioSource.src = currentAudioPath = encodeURI(`${audioBasePath}/${audioSrcs[currentAudio]}.mp3`);
                audio.load();
                audio.volume = 0.75;
            }

            function formatTime(seconds) {
                var minutes = Math.floor(seconds / 60);
                var seconds = Math.floor(seconds % 60);
                return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }

            loadAudio();
            updateButtons();

            audioContainer.style.display = "inline-block";
        });
    </script>

}

}

.release-title {
  margin: 0;

.release-single img {
  display: block;
  margin: auto;
}

.release.playing img.release-cd-cover {
  border-radius: 50%;

  transition: transform calc(60s * 100);
  transition-timing-function: ease;
}

.release-cd {
  width: 100%;
  height: 100%;
  margin-top: 0em;
  margin-bottom: 0.5em;
}

.release-cd-back {
  position: fixed;
  top: inherit;
  left: 0;
  width: 102%;
  max-width: 1000%;
  aspect-ratio: 1 / 0.92;
  object-fit: fill;
  
  pointer-events: none;
  z-index: -1;
}

.release-cd-front {
  position: fixed;
  left: 0;
  width: 102%;
  max-width: 1000%;
  aspect-ratio: 1 / 0.92;
  object-fit: fill;
  opacity: 25%;

  pointer-events: none;
  z-index: 1;
}

.release-cd-cover {
  display: block;
  padding-top: 2%;
  padding-left: 10%;
  width: 90%;
  z-index: 0;

.shadow {

  filter: drop-shadow(0px 0px calc(var(--dropShadowSize) * 0.25) var(--textColor));

}

}

.catalogue-item-artist {
  text-overflow: ellipsis;
  white-space: nowrap;
}

.audio {

  border: none;

}

.audio-title {
  display: block;
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
  flex-grow: 1;
  font-style: italic;
}

.audio-time {
  min-width: 4.5ch;
  text-align: left;
  white-space: nowrap;
}

  padding: 1em;
  padding-top: 2.5em;
  margin: -1em;

}

.audio-position::-webkit-slider-thumb {
  -webkit-appearance: none;

}

.audio-position::-moz-range-thumb {
  -webkit-appearance: none;
  appearance: none;
  opacity: 0;
}

}

 
.audio-position::-moz-range-progress {
  background-color: var(--linkColor);
}
.audio-position::-moz-range-track {  
  background-color: var(--textColor);
}
 
.audio-position::-ms-fill-lower {
  background-color: var(--linkColor);
}
.audio-position::-ms-fill-upper {  
  background-color: var(--textColor);
}

.audio-preview {

}

.audio-preview-controls {
  display: inline-block;
  background-color: var(--textColor);
  min-width: 7.5ch;
}

.audio-preview-button {
  user-select: none;
  padding: 0 0.5ch;
  font-size: 1em;

  background: none;

  border: none;
  cursor: pointer;
}

.shop-button-container {

.button {

.button-text {

.audio-preview-title {

}

<br>
        <span id="mlem002-audio-container" class="audio-preview" style="display: none;">
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function() {
            var audioBasePath = "\/downloads\/[mlem002] Aching Hands - Up in Flames";
            var audioSrcs = [
                "tape1", 
                "tape2", 
                
            ];

            var currentAudio = parseInt("1") - 1;
            var currentAudioPath = "";
            var audioContainer = document.getElementById('mlem002-audio-container');
            var audio = document.getElementById('page-audio');
            var audioSource = document.getElementById('page-audio-source');
            var playButton = document.getElementById('mlem002-play');
            var releaseParent = document.getElementById('mlem002');
            var playing = false;

            playButton.addEventListener('click', function() {
                audio.pause();

                if (playing) {
                    playing = false;
                } else {
                    loadAudio();
                    audio.currentTime = 0;
                    audio.play();
                    playing = true;
                }

                updateButtons();
            });

            audio.addEventListener('ended', function() {
                audio.pause();
                playing = false;
                
                updateButtons();
            });

            audio.addEventListener('timeupdate', function() {                
                updateButtons();
            });

            audio.addEventListener('play', function() {
                if (audioSource.src.includes(currentAudioPath)) { return; }
                
                playing = false;
                
                updateButtons();
            });

            audio.addEventListener('pause', function() {
                playing = false;
                
                updateButtons();
            });

            function updateButtons() {
                if (playing) {
                    playButton.textContent = `■ ${formatTime(audio.currentTime)}`;

                    if (releaseParent != null) {
                        releaseParent.classList.add("playing");
                    }
                } else {
                    playButton.textContent = '► Preview';
                    
                    if (releaseParent != null) {
                        releaseParent.classList.remove("playing");
                    }
                }

            }

            function loadAudio() {
                audioSource.src = currentAudioPath = encodeURI(`${audioBasePath}/${audioSrcs[currentAudio]}.mp3`);
                audio.load();
                audio.volume = 0.75;
            }

            function formatTime(seconds) {
                var minutes = Math.floor(seconds / 60);
                var seconds = Math.floor(seconds % 60);
                return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }

            loadAudio();
            updateButtons();

            audioContainer.style.display = "inline-block";
        });
    </script>

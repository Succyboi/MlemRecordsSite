h3,
h4,
h5,
h6,
strong,
b {

h2 > em,
h3 > em,
h4 > em,
h5 > em,
h6 > em {

}

h2 > a,
h3 > a,
h4 > a,
h5 > a,
h6 > a {

}

.title {

}

.title span {
  font-weight: 400;
}

nav a {
  margin-right: 1ch;
}

textarea {
  width: 100%;

}

input {
  font-size: 16px;
}

content {
  line-height: 1.6;
}

table {
  width: 100%;
}

img {
  max-width: 100%;
}

p {
  margin: 1em 0;
}

p > em img {
  display: block;
  max-width: 75%;
  margin-left: auto;
  margin-right: auto;
}

code {
  padding: 2px;
  background-color: var(--semiBackgroundColor);
}

pre code {
  color: var(--semiTextColor);
  padding: 20px;
  white-space: pre-wrap;
  font-size: 14px;
  overflow-x: auto;
}

hr {
  color: var(--textColor);
  background-color: var(--textColor);
  border-top: 1px solid var(--textColor);
}

footer {
  text-align: center;
}

div.highlight pre {
  background-color: initial;
  color: initial;
}

div.highlight code {
  background-color: unset;
  color: unset;
}

blockquote {
  border-left: 2px solid var(--semiLinkColor);
  color: var(--semiTextColor);
  padding-left: 1em;
  margin-left: 1em;
  font-style: italic;
}

footer {
  padding: 25px;
  justify-content: center;
}

iframe {
  border: 0px;
}

.center {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 1ch;
}

.helptext {
  color: var(--semiTextColor);
  font-size: small;
}

.errorlist {
  color: var(--linkColor);
  font-size: small;
}

 
ul.blog-posts {
  list-style-type: none;
  padding: unset;
}

ul.blog-posts li {
  display: flex;
}

ul.blog-posts li .time {
  min-width: 11ch;
}

ul.blog-posts li a {
  margin-right: 1ch;
}

.inline {
  height: 1em;
  vertical-align: baseline;
}

.release-container {
  display: grid;
  grid-template-columns: 
    repeat(auto-fill, 
     minmax(clamp(100%/3 + 0.1%,(50% - 100%)*1000,100%/2 + 0.1%),1fr));
  justify-items: right;
  margin-top: 0em;
  margin-bottom: 1em;
  gap: 1em;
}

.release {
  margin: auto;
  justify-self: stretch;
  max-width: 100%;
}

.release.big {
  max-width: 100%;
}

.release-single {
  margin-top: 2em;
  margin-bottom: 2em;
  margin-left: 4em;
  margin-right: 4em;
}

.release-header {
  text-transform: lowercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: inherit;
  display: block;
}

.release-title {
  margin: 0;
}

.release-title-small {
  margin: 0;
  font-size: 1.25em;
}

.release-title-smaller {
  margin: 0;
  font-size: 1em;
}

.release-single img {
  display: block;
  margin: auto;
}

.release.playing img.release-cd-cover {
  border-radius: 50%;
  transform: rotate(calc(360deg * 100));

  transition: transform calc(60s * 100);
  transition-timing-function: ease;
}

.release-cd {
  width: 100%;
  height: 100%;
  margin-top: 0em;
  margin-bottom: 0.5em;
}

.release-cd-back {
  position: fixed;
  top: inherit;
  left: 0;
  width: 102%;
  max-width: 1000%;
  aspect-ratio: 1 / 0.92;
  object-fit: fill;
  
  pointer-events: none;
  z-index: -1;
}

.release-cd-front {
  position: fixed;
  left: 0;
  width: 102%;
  max-width: 1000%;
  aspect-ratio: 1 / 0.92;
  object-fit: fill;
  opacity: 25%;

  pointer-events: none;
  z-index: 1;
}

.release-cd-cover {
  display: block;
  padding-top: 2%;
  padding-left: 10%;
  width: 90%;
  z-index: 0;
}

.shadow {
  filter: drop-shadow(0px 0px calc(var(--dropShadowSize) * 0.5) var(--textColor));
}

.halfshadow {
  filter: drop-shadow(0px 0px calc(var(--dropShadowSize) * 0.25) var(--textColor));
}

.release-cd-back.shadow {
  filter: drop-shadow(0px 0px calc(var(--dropShadowSize) * 0.5) var(--textColor));
}

.events-container {
  display: grid;
  grid-template-columns: repeat(2, calc(50% - 10px));
  margin-top: 0em;
  margin-bottom: 1em;
  gap: 1em;
}

.events-archive-container {
  display: grid;
  grid-template-columns: repeat(2, calc(50% - 10px));
  margin-top: 0em;
  margin-bottom: 1em;
  gap: 1em;
}

.catalogue-container {
  font-size: smaller;
  list-style-type: none;
}

.catalogue-item {
  display: flex;
  gap: 1ch;
}

.catalogue-item-no {
  min-width: 7ch;
}

.catalogue-item-name {
  display: block;
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
  flex-grow: 1;
}

.catalogue-item-artist {
  text-overflow: ellipsis;
  white-space: nowrap;
}

.audio {
  position: sticky;
  top: 0;
  text-align: center;
  padding-top: 0;
  padding-bottom: 1em;
  background-color: var(--backgroundColor);
  z-index: 1;
}

.audio-controls {
  height: 1em;
  display: flex;
  align-items: center;
  justify-content: left;
  gap: 1ch;
}

.audio-button {
  width: 2ch;
  min-width: 2ch;
  max-width: 2ch;
  padding: 0;
  font-size: 1.5em;
  color: var(--linkColor);
  background: none;

  border: none;
  cursor: pointer;
}

.audio-title {
  display: block;
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
  flex-grow: 1;
  font-style: italic;
}

.audio-time {
  min-width: 4.5ch;
  text-align: left;
  white-space: nowrap;
}

.audio-position {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 0px;
  background: none;
  padding: 1em;
  padding-top: 2.5em;
  margin: -1em;
  margin-bottom: 0em;
}

.audio-position::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  opacity: 0;
}

.audio-position::-moz-range-thumb {
  -webkit-appearance: none;
  appearance: none;
  opacity: 0;
}

 
.audio-position::-webkit-slider-runnable-track {
  height: 1px;
  -webkit-appearance: none;
  background-color: var(--linkColor);
  margin-top: -1px;
}

 
.audio-position::-moz-range-progress {
  background-color: var(--linkColor);
}
.audio-position::-moz-range-track {  
  background-color: var(--textColor);
}
 
.audio-position::-ms-fill-lower {
  background-color: var(--linkColor);
}
.audio-position::-ms-fill-upper {  
  background-color: var(--textColor);
}

.audio-preview {
  position: relative;
  padding: 0;
  width: 9ch;
  margin-right: 1ch;
}

.audio-preview-controls {
  display: inline-block;
  background-color: var(--textColor);
  min-width: 7.5ch;
}

.audio-preview-button {
  user-select: none;
  padding: 0 0.5ch;
  font-size: 1em;
  color: var(--backgroundColor);
  background: none;

  border: none;
  cursor: pointer;
}

.shop-button-container {
  margin-top: 2em;
  margin-bottom: 2em;
}

.button {
  display: inline-block;
  background-color: var(--textColor);
}

.button-text {
  padding: 0 0.5ch;
  color: var(--backgroundColor);
  background: none;

  border: none;
  text-decoration: none;
  cursor: pointer;
}

.audio-preview-title {
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--backgroundColor);
}

.radio-container {
  display: grid;
  grid-template-columns: calc(40% - 10px) calc(60% - 10px);
  margin-top: 2em;
  margin-bottom: 2em;
  gap: 1em;
  align-items: end;
}

.video-container {
  position: relative;
  overflow: hidden;
  width: 100%;
  padding-top: 56.25%;
}

.video-section {
  margin-top: 1em;
}

.video-embed {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  right: 0;
  width: 100%;
  height: 100%;
}

.ransom_text {
  pointer-events: none;
  margin-top: 0em;
  margin-bottom: 0em;
  margin-right: 0em;
}

.ransom_letter {
  display: inline-block;

  margin-top: 0.5em;
  margin-left: -0.3em;
  margin-right: -0.3em;

  height: 1.5em;
}

@media only screen and (max-width: 768px) {
  .release-container {
    display: grid;

    display: none;

  }

  .release-cd-cover {
    display: block;
    padding-top: 2%;
    padding-left: 10%;
    width: 90%;
    z-index: 0;
  }

  .events-container {
    display: grid;
    grid-template-columns: repeat(1, 100%);
    margin-top: 0em;
    margin-bottom: 1em;
    gap: 1em;
  }

  .events-archive-container {
    display: grid;
    grid-template-columns: repeat(1, 100%);
    margin-top: 0em;
    margin-bottom: 1em;
    gap: 3em;
  }

  .radio-container {
    display: grid;
    grid-template-columns: repeat(1, 100%);
    margin-top: 2em;
    margin-bottom: 3em;
    gap: 1em;
    align-items: end;
  }
}

  <p>Peter Toth has 1 Mlem release.</p>

  <div class="release-container">
    
    
    
    

    <div id="mlem018" class="release big">
        <small class="release-header">
            mlem018<i> EP</i>
        </small>
        
            <div class="release-cd">
                
                <img src="/images/cd_front0_hu_cd087eb5bce02621.png" class="release-cd-back shadow">
                <img src="/images/cd_back_hu_2c3f8ab1f30608c6.png" class="release-cd-back shadow"><a href="https://staging.mlemrecords.com/mlem018/">
                    
                    <img src="/mlem018/cover_hu_6843661e1dc21221.png" loading="lazy" alt="The cover for Collection of Bygone Days." class="release-cd-cover">
                    
                </a>
                
            </div>
        
        <h2 class="release-title-small">
            <a href="https://staging.mlemrecords.com/mlem018/">Collection of Bygone Days</a>
        </h2>by 
     <a href="https://staging.mlemrecords.com/artists/peter-toth/">Peter Toth</a>
<br>
        <span id="mlem018-audio-container" class="audio-preview" style="display: none;">
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function() {
            var audioBasePath = "\/downloads\/[mlem018] Peter Toth - Collection of Bygone Days";
            var audioSrcs = [
                "1. Grotesques", 
                "2. Third Etude", 
                "3. Rain Nine", 
                "4. Cube Song", 
                "5. MO_tion", 
                "6. Fourth Etude", 
                "7. Fly Away", 
                "8. Swishmora", 
                
            ];

            var currentAudio = parseInt("1") - 1;
            var currentAudioPath = "";
            var audioContainer = document.getElementById('mlem018-audio-container');
            var audio = document.getElementById('page-audio');
            var audioSource = document.getElementById('page-audio-source');
            var playButton = document.getElementById('mlem018-play');
            var releaseParent = document.getElementById('mlem018');
            var playing = false;

            playButton.addEventListener('click', function() {
                audio.pause();

                if (playing) {
                    playing = false;
                } else {
                    loadAudio();
                    audio.currentTime = 0;
                    audio.play();
                    playing = true;
                }

                updateButtons();
            });

            audio.addEventListener('ended', function() {
                audio.pause();
                playing = false;
                
                updateButtons();
            });

            audio.addEventListener('timeupdate', function() {                
                updateButtons();
            });

            audio.addEventListener('play', function() {
                if (audioSource.src.includes(currentAudioPath)) { return; }
                
                playing = false;
                
                updateButtons();
            });

            audio.addEventListener('pause', function() {
                playing = false;
                
                updateButtons();
            });

            function updateButtons() {
                if (playing) {
                    playButton.textContent = `■ ${formatTime(audio.currentTime)}`;

                    if (releaseParent != null) {
                        releaseParent.classList.add("playing");
                    }
                } else {
                    playButton.textContent = '► Preview';
                    
                    if (releaseParent != null) {
                        releaseParent.classList.remove("playing");
                    }
                }

            }

            function loadAudio() {
                audioSource.src = currentAudioPath = encodeURI(`${audioBasePath}/${audioSrcs[currentAudio]}.mp3`);
                audio.load();
                audio.volume = 0.75;
            }

            function formatTime(seconds) {
                var minutes = Math.floor(seconds / 60);
                var seconds = Math.floor(seconds % 60);
                return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }

            loadAudio();
            updateButtons();

            audioContainer.style.display = "inline-block";
        });
    </script>

    <span class="audio-preview-controls">
        <a id="mlem018-play" class="audio-preview-button"></a>

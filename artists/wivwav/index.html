.release-container {
  display: grid;
  grid-template-columns: 
    repeat(auto-fill, 
     minmax(clamp(100%/3 + 0.1%,(50% - 100%)*1000,100%/2 + 0.1%),1fr));
  justify-items: right;
  margin-top: 0em;
  margin-bottom: 1em;
  gap: 1em;
}

.release {
  margin: auto;
  justify-self: stretch;
  max-width: 100%;
}

.release.big {
  max-width: 100%;
}

.release-single {
  margin-top: 2em;
  margin-bottom: 2em;
  margin-left: 4em;
  margin-right: 4em;
}

.release-header {
  text-transform: lowercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: inherit;
  display: block;
}

.release-title {
  margin: 0;
}

.release-title-small {
  margin: 0;
  font-size: 1.25em;
}

.release-title-smaller {
  margin: 0;
  font-size: 1em;
}

.release-single img {
  display: block;
  margin: auto;
}

.release.playing img.release-cd-cover {
  border-radius: 50%;
  transform: rotate(calc(360deg * 100));

  transition: transform calc(60s * 100);
  transition-timing-function: ease;
}

.release-cd {
  width: 100%;
  height: 100%;
  margin-top: 0em;
  margin-bottom: 0.5em;
}

.release-cd-back {
  position: fixed;
  top: inherit;
  left: 0;
  width: 102%;
  max-width: 1000%;
  aspect-ratio: 1 / 0.92;
  object-fit: fill;
  
  pointer-events: none;
  z-index: -1;
}

.release-cd-front {
  position: fixed;
  left: 0;
  width: 102%;
  max-width: 1000%;
  aspect-ratio: 1 / 0.92;
  object-fit: fill;
  opacity: 25%;

  pointer-events: none;
  z-index: 1;
}

.release-cd-cover {
  display: block;
  padding-top: 2%;
  padding-left: 10%;
  width: 90%;
  z-index: 0;
}

.shadow {
  filter: drop-shadow(0px 0px calc(var(--dropShadowSize) * 0.5) var(--textColor));
}

.halfshadow {
  filter: drop-shadow(0px 0px calc(var(--dropShadowSize) * 0.25) var(--textColor));
}

.release-cd-back.shadow {
  filter: drop-shadow(0px 0px calc(var(--dropShadowSize) * 0.5) var(--textColor));
}

.events-container {
  display: grid;
  grid-template-columns: repeat(2, calc(50% - 10px));
  margin-top: 0em;
  margin-bottom: 1em;
  gap: 1em;
}

.events-archive-container {

  grid-template-columns: repeat(2, calc(50% - 10px));

  margin-bottom: 1em;
  gap: 1em;
}

.catalogue-container {
  font-size: smaller;
  list-style-type: none;
}

.catalogue-item {
  display: flex;
  gap: 1ch;
}

.catalogue-item-no {
  min-width: 7ch;
}

.catalogue-item-name {
  display: block;
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
  flex-grow: 1;
}

.catalogue-item-artist {
  text-overflow: ellipsis;
  white-space: nowrap;
}

.audio {
  position: sticky;
  top: 0;
  text-align: center;
  padding-top: 0;
  padding-bottom: 1em;
  background-color: var(--backgroundColor);
  z-index: 1;
}

.audio-controls {
  height: 1em;
  display: flex;
  align-items: center;
  justify-content: left;
  gap: 1ch;
}

.audio-button {
  width: 2ch;
  min-width: 2ch;
  max-width: 2ch;
  padding: 0;
  font-size: 1.5em;
  color: var(--linkColor);
  background: none;

  border: none;
  cursor: pointer;
}

.audio-title {
  display: block;
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
  flex-grow: 1;
  font-style: italic;
}

.audio-time {
  min-width: 4.5ch;
  text-align: left;
  white-space: nowrap;
}

.audio-position {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 0px;
  background: none;
  padding: 1em;
  padding-top: 2.5em;
  margin: -1em;
  margin-bottom: 0em;
}

.audio-position::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  opacity: 0;
}

.audio-position::-moz-range-thumb {
  -webkit-appearance: none;
  appearance: none;
  opacity: 0;
}

 
.audio-position::-webkit-slider-runnable-track {
  height: 1px;
  -webkit-appearance: none;
  background-color: var(--linkColor);
  margin-top: -1px;
}

 
.audio-position::-moz-range-progress {
  background-color: var(--linkColor);
}
.audio-position::-moz-range-track {  
  background-color: var(--textColor);
}
 
.audio-position::-ms-fill-lower {
  background-color: var(--linkColor);
}
.audio-position::-ms-fill-upper {  
  background-color: var(--textColor);
}

.audio-preview {
  position: relative;
  padding: 0;
  width: 9ch;
  margin-right: 1ch;
}

.audio-preview-controls {
  display: inline-block;
  background-color: var(--textColor);
  min-width: 7.5ch;
}

.audio-preview-button {
  user-select: none;
  padding: 0 0.5ch;
  font-size: 1em;
  color: var(--backgroundColor);
  background: none;

  border: none;
  cursor: pointer;
}

.shop-button-container {
  margin-top: 2em;
  margin-bottom: 2em;
}

.button {
  display: inline-block;
  background-color: var(--textColor);
}

.button-text {
  padding: 0 0.5ch;
  color: var(--backgroundColor);
  background: none;

  border: none;
  text-decoration: none;
  cursor: pointer;
}

.audio-preview-title {
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--backgroundColor);
}

.radio-container {
  display: grid;

  margin-bottom: 2em;
  gap: 1em;

.video-container {

  width: 100%;
  padding-top: 56.25%;
}

.video-section {
  margin-top: 1em;
}

.video-embed {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  right: 0;
  width: 100%;
  height: 100%;
}

.ransom_text {

  margin-bottom: 0em;
  margin-right: 0em;
}

.ransom_letter {

  margin-left: -0.3em;
  margin-right: -0.3em;

  height: 1.5em;
}

        <small class="release-header">
            mlem012<i> Album</i>
        </small>

                <img src="/images/cd_front0_hu_cd087eb5bce02621.png" class="release-cd-back shadow">
                <img src="/images/cd_back_hu_2c3f8ab1f30608c6.png" class="release-cd-back shadow"><a href="https://mlemrecords.com/mlem012/">
                    
                    <img src="/mlem012/cover_hu_f593ff4366fe0be7.png" loading="lazy" alt="The cover for Elektronische Meuk Vol. 1." class="release-cd-cover">
                    
                </a>
                
            </div>
        
        <h2 class="release-title-small">
            <a href="https://mlemrecords.com/mlem012/">Elektronische Meuk Vol. 1</a>
        </h2>by 
     <a href="https://mlemrecords.com/artists/wivwav/">WivWav</a>
<br>
        <span id="mlem012-audio-container" class="audio-preview" style="display: none;">
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function() {
            var audioBasePath = "\/downloads\/[mlem012] WivWav - Elektronische Meuk Vol. 1";
            var audioSrcs = [
                "1. Intro", 
                "2. Baksteen", 
                "3. Momentum", 
                "4. Voordat Hij Crasht", 
                "5. Yoghurtsaus", 
                "6. Nog Even", 
                "7. Zinnen", 
                "8. Huh_", 
                "9. DYBIS", 
                "10. Het Komt Wel Goed", 
                "11. Opvulling", 
                
            ];

            var currentAudio = parseInt("6") - 1;
            var currentAudioPath = "";
            var audioContainer = document.getElementById('mlem012-audio-container');
            var audio = document.getElementById('page-audio');
            var audioSource = document.getElementById('page-audio-source');
            var playButton = document.getElementById('mlem012-play');
            var releaseParent = document.getElementById('mlem012');
            var playing = false;

            playButton.addEventListener('click', function() {
                audio.pause();

                if (playing) {
                    playing = false;
                } else {
                    loadAudio();
                    audio.currentTime = 0;
                    audio.play();
                    playing = true;
                }

                updateButtons();
            });

            audio.addEventListener('ended', function() {
                audio.pause();
                playing = false;
                
                updateButtons();
            });

            audio.addEventListener('timeupdate', function() {                
                updateButtons();
            });

            audio.addEventListener('play', function() {
                if (audioSource.src.includes(currentAudioPath)) { return; }
                
                playing = false;
                
                updateButtons();
            });

            audio.addEventListener('pause', function() {
                playing = false;
                
                updateButtons();
            });

            function updateButtons() {
                if (playing) {
                    playButton.textContent = `■ ${formatTime(audio.currentTime)}`;

                    if (releaseParent != null) {
                        releaseParent.classList.add("playing");
                    }
                } else {
                    playButton.textContent = '► Preview';
                    
                    if (releaseParent != null) {
                        releaseParent.classList.remove("playing");
                    }
                }

            }

            function loadAudio() {
                audioSource.src = currentAudioPath = encodeURI(`${audioBasePath}/${audioSrcs[currentAudio]}.mp3`);
                audio.load();
                audio.volume = 0.75;
            }

            function formatTime(seconds) {
                var minutes = Math.floor(seconds / 60);
                var seconds = Math.floor(seconds % 60);
                return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }

            loadAudio();
            updateButtons();

            audioContainer.style.display = "inline-block";
        });
    </script>

    <span class="audio-preview-controls">
